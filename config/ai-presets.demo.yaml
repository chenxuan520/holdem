# Demo preset file. Copy this to `config/ai-presets.yaml` and fill in real
# endpoint / token / model values:
#
#   cp config/ai-presets.demo.yaml config/ai-presets.yaml
#
# Each preset describes one OpenAI-compatible model that can sit at the table.
#
# IMPORTANT for benchmarks:
# The complete poker decision framework + output contract already lives in the
# backend (see backend/internal/ai/client.go::systemInstruction). To compare
# different models fairly, leave `system_prompt` empty so every preset gets
# byte-for-byte the same prompt. If you set `system_prompt`, it is prepended
# to the shared framework — only do this when you intentionally want to
# A/B-test "model X with persona Y" against a baseline. Note: a non-empty
# system_prompt also costs extra input tokens on every request.
#
# structured_output controls how the backend asks the provider to return a
# decision. Allowed values:
#   - tool_call   (default) request a `submit_action` tool call. Use this when
#                 the provider supports OpenAI tool/function calling.
#   - json_object request `response_format={"type":"json_object"}` only.
#   - none        send no structured-output hints; rely purely on the prompt
#                 and the parser fallback to extract `{ ... }` from content.
#
# When the field is omitted the backend uses tool_call.
#
# max_tokens (optional) overrides the per-attempt output ceiling. Reasoning
# models stream a long chain-of-thought before the answer, so on the small
# defaults the answer gets truncated to empty — give them a big value (e.g.
# 4096). Non-reasoning models can leave it unset.
#
# extra_body (optional) is merged verbatim into the request body — an escape
# hatch for provider-specific params. Example: turn OFF DeepSeek V4's default
# thinking (cheaper + faster, no chain-of-thought, and a small max_tokens is
# then enough) instead of paying for a big reasoning budget:
#   extra_body:
#     thinking:
#       type: disabled
presets:
  - id: tight-shark
    name: Benchmark A
    endpoint: https://api.openai.com/v1
    token: replace-with-your-token
    model: gpt-4o-mini
    structured_output: tool_call
    # Empty on purpose; see comment above. The shared framework handles role,
    # decision steps, action validity, output contract, and reason length.
    system_prompt: ""

  - id: loose-caller
    name: Benchmark B
    endpoint: https://api.deepseek.com
    token: replace-with-your-token
    model: deepseek-chat
    structured_output: tool_call
    system_prompt: ""

  - id: balanced-pro
    name: Benchmark C
    endpoint: https://api.example.com/v1
    token: replace-with-your-token
    model: some-other-model
    # structured_output omitted -> defaults to tool_call. If your provider does
    # not support tools yet, switch this preset to `json_object` or `none`.
    system_prompt: ""
